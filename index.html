.pb{border:0;background:transparent;padding:0;display:flex;flex-direction:column;align-items:center;gap:5px;color:var(--mute);font-size:12px;font-weight:800;flex:none;width:64px}

input,select,textarea{width:100%;background:var(--field);border:2px solid transparent;border-radius:14px;height:48px;padding:0 14px;font-size:16px;font-weight:700;color:var(--ink);outline:none}
textarea{height:90px;padding:12px;font-size:14px;resize:none}
input:focus,textarea:focus{border-color:var(--acc)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.c{border:0;background:var(--field);color:var(--mute);border-radius:999px;height:34px;padding:0 13px;font-size:13px;font-weight:800}
.c.on{background:var(--acc);color:var(--accink)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.go{width:100%;height:52px;border:0;border-radius:16px;background:var(--acc);color:var(--accink);font-size:16.5px;font-weight:900;margin-top:18px}
.note{font-size:12.5px;color:var(--mute);line-height:1.5;margin:8px 2px;font-weight:600}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0) + 28px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:14px;font-weight:800;font-size:14px;z-index:30;white-space:nowrap}
.fx{animation:fx .4s ease}@keyframes fx{from{opacity:0}to{opacity:1}}
.photo{display:flex;align-items:center;gap:14px}.photo .av{width:72px;height:72px;font-size:34px}
.welcome{text-align:center;padding:40px 16px}.welcome .av{width:110px;height:110px;font-size:56px;margin:0 auto 16px}
.welcome h2{font-size:24px;font-weight:900;margin:0 0 6px}.welcome p{color:var(--mute);font-weight:700;margin:0 0 20px;line-height:1.5}
</style>
</head>

var CT={vac:['Vaccine','syringe'],worm:['Deworming','pill'],flea:['Flea & tick','bug'],vet:['Vet check-up','vet'],nails:['Nail trim','scissors'],groom:['Grooming','scissors'],bath:['Bath','bath'],teeth:['Teeth','tooth'],meds:['Medication','pill'],other:['Other','star']};
var PRE={cat:[['vac','Vaccine',1,'y'],['worm','Deworming (internal)',3,'m'],['flea','Flea & tick',1,'m'],['vet','Vet check-up',1,'y'],['nails','Nail trim',3,'w']],
 dog:[['vac','Vaccine',1,'y'],['vac','Rabies vaccine',1,'y'],['worm','Deworming (internal)',3,'m'],['flea','Flea & tick',1,'m'],['vet','Vet check-up',1,'y'],['nails','Nail trim',4,'w'],['bath','Bath',1,'m']]};
var LT={vet:['Vet visit','vet'],sym:['Symptom','heart'],food:['Food','food'],meds:['Medication','pill'],note:['Note','note']};
var UN={d:['day','days'],w:['week','weeks'],m:['month','months'],y:['year','years']};

var S={pets:[],care:[],log:[],w:[],sel:null,theme:'auto',alerts:[3,1,0],hour:10,push:{}};
try{var r0=localStorage.getItem('petcare');if(r0)S=Object.assign(S,JSON.parse(r0))}catch(e){}
if(!S.push)S.push={};
var view='home',sh=null,exp=null,arm=null,wdraft='',tT;
function saveRaw(){try{localStorage.setItem('petcare',JSON.stringify(S))}catch(e){toast('Storage is full. Use smaller photos.')}}
function save(){saveRaw();if(S.push.on)queueSync()}

/* utils */
function pad(n){return('0'+n).slice(-2)}
function fmt(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function today(){return fmt(new Date())}
function pd(s){var a=s.split('-');return new Date(+a[0],+a[1]-1,+a[2])}
function diff(s){return Math.round((pd(s)-pd(today()))/864e5)}
function dim(y,m){return new Date(y,m+1,0).getDate()}
function addI(s,n,u){var d=pd(s);if(u==='d'||u==='w'){d.setDate(d.getDate()+n*(u==='w'?7:1));return fmt(d)}var t=d.getMonth()+n*(u==='y'?12:1),y=d.getFullYear()+Math.floor(t/12),m=((t%12)+12)%12;return fmt(new Date(y,m,Math.min(d.getDate(),dim(y,m))))}
function every(c){return c.en===1?'Every '+UN[c.eu][0]:'Every '+c.en+' '+UN[c.eu][1]}
function dshort(s){return pd(s).toLocaleDateString('en-GB',{day:'numeric',month:'short'})}
function dlong(s){return pd(s).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'})}
function inTxt(n){return n<0?(-n===1?'1 day overdue':-n+' days overdue'):n===0?'Due today':n===1?'Tomorrow':'In '+n+' days'}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,5)}
function num(v){var n=parseFloat(String(v).replace(',','.'));return isFinite(n)?n:NaN}
function f1(n){return(Math.round(n*100)/100).toString()}
function toast(t){clearTimeout(tT);var o=document.getElementById('tt');if(o)o.remove();var d=document.createElement('div');d.className='toast';d.id='tt';d.textContent=t;document.body.appendChild(d);tT=setTimeout(function(){d.remove()},2400)}
function fx(el){if(!el)return;el.classList.remove('fx');void el.offsetWidth;el.classList.add('fx')}
function applyTheme(){var r=document.documentElement;if(S.theme==='light'||S.theme==='dark')r.setAttribute('data-theme',S.theme);else r.removeAttribute('data-theme');var dk=S.theme==='dark'||(S.theme!=='light'&&window.matchMedia&&matchMedia('(prefers-color-scheme:dark)').matches);var m=document.querySelector('meta[name=theme-color]');if(m)m.setAttribute('content',dk?'#15110e':'#fbf6f0')}
function pet(id){return S.pets.filter(function(p){return p.id===id})[0]}
function cur(){var p=pet(S.sel);if(!p&&S.pets.length){p=S.pets[0];S.sel=p.id}return p}
function emo(p){return p&&p.sp==='dog'?'🐶':'🐱'}
function avatar(p){return'<span class="av">'+(p&&p.photo?'<img src="'+p.photo+'" alt="">':emo(p))+'</span>'}
function age(b){if(!b)return'';var d=pd(b),n=new Date(),m=(n.getFullYear()-d.getFullYear())*12+n.getMonth()-d.getMonth();if(n.getDate()<d.getDate())m--;if(m<0)return'';if(m<1){var dd=Math.max(0,Math.round((n-d)/864e5));return dd+(dd===1?' day':' days')}var y=Math.floor(m/12),mo=m%12;return(y?y+(y===1?' year':' years'):'')+(y&&mo?' ':'')+(mo?mo+' mo':'')}
function weights(pid){return S.w.filter(function(x){return x.pet===pid}).sort(function(a,b){return a.d<b.d?-1:a.d>b.d?1:a.t-b.t})}

/* ---------- push notifications via GitHub Actions ---------- */
var REPO=(function(){var p=location.pathname.split('/')[1];return /\.github\.io$/.test(location.hostname)&&p?location.hostname.split('.')[0]+'/'+p:'razvntv-crypto/petcare'})();
function b64u(buf){var b=new Uint8Array(buf),s='';for(var i=0;i<b.length;i++)s+=String.fromCharCode(b[i]);return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
function ub64(s){s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';var r=atob(s),a=new Uint8Array(r.length);for(var i=0;i<r.length;i++)a[i]=r.charCodeAt(i);return a}
function hsh(t){var h=5381;for(var i=0;i<t.length;i++)h=(h*33^t.charCodeAt(i))>>>0;return h.toString(36)}
function pushKey(){if(!S.push.key){S.push.key=b64u(crypto.getRandomValues(new Uint8Array(32)));saveRaw()}return S.push.key}
function standalone(){return(window.navigator.standalone===true)||(window.matchMedia&&matchMedia('(display-mode: standalone)').matches)}
function gh(path,opt){opt=opt||{};opt.headers={'Authorization':'Bearer '+S.push.token,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json'};return fetch('https://api.github.com/repos/'+REPO+path,opt)}
function ghErr(st){return st===401?'GitHub token is invalid or expired. Paste a new one.':(st===403||st===404)?'The token has no access to the '+REPO.split('/')[1]+' repo. Check its permissions.':'GitHub error '+st+'. Try again.'}
var syncT=null,syncing=false;
function queueSync(){clearTimeout(syncT);syncT=setTimeout(function(){doSync(false)},1200)}
async function curSub(){if(!('serviceWorker' in navigator))return null;var reg=await Promise.race([navigator.serviceWorker.ready,new Promise(function(r){setTimeout(r,4000)})]);if(!reg||!reg.pushManager)return null;var sub=await reg.pushManager.getSubscription();return sub?sub.toJSON():null}
async function doSync(force){
 if(!S.push.token){S.push.err='Paste your GitHub token first.';saveRaw();if(view==='set')render();return false}
 if(syncing){queueSync();return false}syncing=true;
 try{
  var sub=S.push.on?await curSub():null;
  var cfg={v:1,tz:'Europe/Bucharest',hour:S.hour,alerts:S.alerts,vapid:S.push.on?S.push.vapid:null,sub:sub,
   items:S.care.map(function(c){var p=pet(c.pet);return{pet:p?p.name:'',n:c.n,t:c.t,d:c.next,paused:!p||!!c.paused}})};
  var plain=JSON.stringify(cfg),h=hsh(plain);
  if(!force&&h===S.push.h&&!S.push.err){syncing=false;return true}
  var key=await crypto.subtle.importKey('raw',ub64(pushKey()),'AES-GCM',false,['encrypt']);
  var iv=crypto.getRandomValues(new Uint8Array(12));
  var ct=await crypto.subtle.encrypt({name:'AES-GCM',iv:iv},key,new TextEncoder().encode(plain));
  var box=JSON.stringify({v:1,iv:b64u(iv),ct:b64u(ct)});
  for(var attempt=0;attempt<2;attempt++){
   var g=await gh('/contents/schedule.enc'),sha=null;
   if(g.ok)sha=(await g.json()).sha;else if(g.status!==404)throw g.status;
   var body={message:'Update schedule',content:btoa(box)};if(sha)body.sha=sha;
   var p=await gh('/contents/schedule.enc',{method:'PUT',body:JSON.stringify(body)});
   if(p.ok){S.push.h=h;S.push.err='';S.push.synced=Date.now();saveRaw();syncing=false;if(view==='set')render();return true}
   if(p.status!==409&&p.status!==422)throw p.status}
  throw 409;
 }catch(e){S.push.err=typeof e==='number'?ghErr(e):'Could not reach GitHub. It will retry on the next change.';saveRaw();syncing=false;if(view==='set')render();return false}}
async function pushOn(){
 if(!standalone()){toast('Open Petcare from the Home Screen icon first');return}
 if(!('serviceWorker' in navigator)||!('PushManager' in window)||!('Notification' in window)){toast('This browser does not support notifications');return}
 if(!S.push.token){toast('Paste the GitHub token first');return}
 var perm=await Notification.requestPermission();if(perm!=='granted'){toast('Notifications were not allowed');render();return}
 try{
  if(!S.push.vapid){var kp=await crypto.subtle.generateKey({name:'ECDSA',namedCurve:'P-256'},true,['sign','verify']);
   var raw=await crypto.subtle.exportKey('raw',kp.publicKey),jwk=await crypto.subtle.exportKey('jwk',kp.privateKey);S.push.vapid={pub:b64u(raw),priv:jwk.d};saveRaw()}
  var reg=await navigator.serviceWorker.ready,old=await reg.pushManager.getSubscription();if(old)await old.unsubscribe();
  await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:ub64(S.push.vapid.pub)});
  S.push.on=true;saveRaw();var ok=await doSync(true);render();toast(ok?'Notifications are on':'Turned on, but sync failed');
 }catch(e){toast('Could not turn on notifications');render()}}
async function pushOff(){try{var reg=await navigator.serviceWorker.ready,sub=await reg.pushManager.getSubscription();if(sub)await sub.unsubscribe()}catch(e){}S.push.on=false;saveRaw();await doSync(true);render();toast('Notifications are off')}
async function pushTest(){var ok=await doSync(true);if(!ok){toast('Sync failed, see Settings');return}
 var r=await gh('/actions/workflows/notify.yml/dispatches',{method:'POST',body:JSON.stringify({ref:'main',inputs:{test:true}})});
 toast(r.status===204?'Test sent, arrives in about a minute':r.status===403||r.status===404?'Token needs Actions: Read and write for the test':'Could not start the test ('+r.status+')')}
function alertTxt(){var a=S.alerts.slice().sort(function(x,y){return y-x}),b=a.filter(function(x){return x>0}).map(function(x){return x===1?'1 day':x+' days'}),t=b.length?(b.length>1?b.slice(0,-1).join(', ')+' and '+b[b.length-1]:b[0])+' before':'';if(a.indexOf(0)>-1)t+=(t?' and ':'')+'on the day';return t}
function timeAgo(t){var m=Math.round((Date.now()-t)/6e4);return m<1?'just now':m<60?m+' min ago':new Date(t).toLocaleString('en-GB',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}

/* views */
function chart(arr){
 if(arr.length<2)return'';
 var W=340,H=120,L=30,R=8,T=8,B=20,vals=arr.map(function(x){return x.kg});
 var mn=Math.min.apply(0,vals),mx=Math.max.apply(0,vals),pd_=Math.max(.15,(mx-mn)*.2);mn-=pd_;mx+=pd_;
 var t0=pd(arr[0].d).getTime(),t1=pd(arr[arr.length-1].d).getTime(),sp=Math.max(1,t1-t0);
 function X(d){return L+(pd(d).getTime()-t0)/sp*(W-L-R)}function Y(v){return T+(mx-v)/(mx-mn)*(H-T-B)}
 var s='<svg viewBox="0 0 '+W+' '+H+'">';
 [mn+(mx-mn)*.15,mx-(mx-mn)*.15].forEach(function(v){var y=Y(v);s+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y+'" y2="'+y+'" stroke="var(--line)"/><text x="'+(L-5)+'" y="'+(y+3)+'" text-anchor="end">'+v.toFixed(1)+'</text>'});
 var path=arr.map(function(x,i){return(i?'L':'M')+X(x.d).toFixed(1)+' '+Y(x.kg).toFixed(1)}).join('');
 var area=path+'L'+X(arr[arr.length-1].d).toFixed(1)+' '+(H-B)+'L'+X(arr[0].d).toFixed(1)+' '+(H-B)+'Z';
 s+='<path d="'+area+'" fill="var(--acc)" opacity=".12"/><path d="'+path+'" fill="none" stroke="var(--acc)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>';
 arr.forEach(function(x){s+='<circle cx="'+X(x.d)+'" cy="'+Y(x.kg)+'" r="3" fill="var(--card)" stroke="var(--acc)" stroke-width="2"/>'});
 s+='<text x="'+L+'" y="'+(H-5)+'">'+dshort(arr[0].d)+'</text><text x="'+(W-R)+'" y="'+(H-5)+'" text-anchor="end">'+dshort(arr[arr.length-1].d)+'</text>';
 return'<div class="chart">'+s+'</svg></div>'}
